<!doctype html>
<html lang="en" class="mode-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level Up · Film mode</title>
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .film-shell { position: fixed; inset: 0; background: #000; }
      .film-shell--recording, .film-shell--recording * { cursor: none !important; }
      .film-frame { position: absolute; border: 0; transform-origin: 0 0; pointer-events: none; background: #000; }
      .film-start { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.55); }
      .film-start-card {
        display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px 40px;
        border-radius: 20px; background: rgb(13 0 77 / 0.85); border: 1px solid rgb(193 191 255 / 0.25);
        text-align: center;
      }
      .film-debug {
        position: fixed; left: 16px; right: 16px; bottom: 12px; display: flex; align-items: center; gap: 12px;
        padding: 8px 12px; border-radius: 8px; background: rgb(0 0 0 / 0.75); color: #fff;
        font: 12px/1.2 ui-monospace, Menlo, monospace;
      }
      .film-debug input { flex: 1; }
      .film-debug button { font: inherit; color: inherit; background: #333; border: 1px solid #555; border-radius: 4px; padding: 4px 10px; }
      .film-timecode { min-width: 300px; text-align: right; white-space: pre; }
    </style>
  </head>
  <body>
    <!-- Film mode: a scripted, self-running sequence of the demo for the Innovation Day video. -->
    <div id="root"></div>
    <script type="module" src="./src/film/shell.jsx"></script>
  </body>
</html>
